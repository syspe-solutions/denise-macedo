name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova cancela a anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      # canonical, og:url e og:image precisam de endereço absoluto.
      # Usa o endereço real do Pages (projeto, site da organização ou domínio próprio).
      - name: Ajustar o endereço absoluto do site
        run: sed -i "s|__SITE_URL__|${{ steps.pages.outputs.base_url }}|g" site/index.html

      # Chave para abrir o site ao Google. Por padrão fica FECHADO (noindex).
      # Para abrir:   gh variable set INDEXAR_SITE --body true --repo syspe-solutions/denise-macedo
      # Para fechar:  gh variable delete INDEXAR_SITE --repo syspe-solutions/denise-macedo
      # Depois, rode o workflow de novo (Actions → Publicar no GitHub Pages → Run workflow).
      - name: Permitir indexação (só se INDEXAR_SITE for "true")
        if: ${{ vars.INDEXAR_SITE == 'true' }}
        run: |
          sed -i '/name="robots"/d' site/index.html
          BASE="${{ steps.pages.outputs.base_url }}"
          printf 'Sitemap: %s/sitemap.xml\n' "$BASE" >> site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/</loc></url>\n</urlset>\n' "$BASE" > site/sitemap.xml

      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
